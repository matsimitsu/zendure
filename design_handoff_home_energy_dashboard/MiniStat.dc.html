<html>
<head>

<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:3px; font-family: Inter, system-ui, sans-serif;">

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rate&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+1,200 W&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
