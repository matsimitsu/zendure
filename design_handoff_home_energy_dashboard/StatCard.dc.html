<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background: oklch(0.23 0.015 250); border: 1px solid oklch(1 0 0 / 0.08); border-radius: 10px; padding: 18px 20px; display:flex; flex-direction:column; gap:12px; height:100%; box-sizing:border-box; font-family: Inter, system-ui, sans-serif;">
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="width:30px; height:30px; border-radius:7px; background: {{ iconBg }}; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;">{{ glyph }}</div>
    <div style="font-size:12.5px; color: oklch(0.65 0.02 250); font-weight:500;">{{ label }}</div>
  </div>
  <div style="display:flex; align-items:baseline; gap:5px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size:28px; font-weight:600; color: oklch(0.96 0.01 250); line-height:1;">{{ value }}</span>
    <span style="font-size:13px; color: oklch(0.55 0.02 250);">{{ unit }}</span>
  </div>
  <svg viewBox="0 0 96 28" preserveAspectRatio="none" style="width:100%; height:28px; display:block;">
    <path d="{{ sparkline }}" fill="none" stroke="{{ sparkColor }}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
  </svg>
  <div style="font-size:12px; color: oklch(0.6 0.02 250);">{{ detail }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:180},&quot;glyph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;☀&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;iconBg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;oklch(0.3 0.06 75)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Solar production&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2,130&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;W&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Peak today: 2,240 W&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sparkline&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sparkColor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;oklch(0.75 0.15 75)&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
