# zendure — /etc/zendure/config.toml
#
# Deployed by ansible (odroid-ansible, roles/zendure). The values here are the
# ones production runs, so this file doubles as the record of what those are.
#
# Everything the daemon reads is here. The one exception is RUST_LOG, which
# overrides [logging].filter when it is set — that is a tracing convention, not
# configuration, and it is how an operator raises a log level from a
# `systemctl edit` drop-in without touching this file.
#
# FAILURE POLICY, DELIBERATELY SPLIT
#
#   fatal  — not valid TOML; a table that is not a table; a missing or
#            wrong-typed connection setting; anything about a device.
#   warns  — a wrong-typed tuning knob, a bad journal or logging setting, an
#            unknown key. The default is used and the daemon runs.
#
# The rule is one line: if getting it wrong means the controller talks to the
# wrong thing or cannot talk at all, it is fatal; if it means the controller
# decides slightly differently, it warns and defaults.
#
# That asymmetry is deliberate. systemd restarts this service on failure every
# 30s, and a restart loop leaves the battery holding whatever command it last
# received — so a typo in a *logging* knob must never be the thing that stops
# the controller. Loud and running beats silent and stopped.
#
# `zendure --check --config <path>` is strict about both, and ansible runs it
# before this file is ever moved into place. So a typo fails a deploy rather
# than quietly degrading a running controller.

[mqtt]
host = "127.0.0.1"          # required
port = 1883
client_id = "odroid"
# Both or neither. One alone is ignored by the client, so it is a warning here.
# username = "…"
# password = "…"

# The batteries to control. One entry today; the array is the reason this file
# exists, since a device list cannot be expressed in environment variables.
[[device]]
kind = "zendure"
ip = "192.168.1.253"
sn = "HEC4NENCN490270"
# The control tick: how often every source is sampled and a decision is made.
# Minimum 3, the rate the battery refreshes its own report. The HTTP request
# timeout derives from it too (see README).
poll_interval_secs = 3

[shelly]
ip = "192.168.1.11"   # required
# Which meter phase the solar inverter (Huawei Sun2000) feeds into: A, B or C.
# Solar production is read as the export on that single phase, because the
# meter's total nets solar export against loads on the other phases.
solar_phase = "A"

[homeassistant]
publish_prefix = "zendure"

# Presence, not a flag, turns the live dashboard on — absent (as here) runs no
# HTTP listener at all.
# [web]
# bind_address = "127.0.0.1"   # default
# port = 8080                  # default

# Presence turns on the dashboard's solar-forecast panel — same rule [web]
# follows. `kind = "solcast"` is the real backend: two Solcast rooftop_site
# forecasts, summed (one physical array split east/west by orientation).
# Solcast's free tier caps usage at 10 requests/day account-wide, so the
# default poll_times spend exactly 5/site across daylight hours, skipping the
# night when nothing changes. `kind = "simulated"` needs no api_key/site ids
# and draws a synthetic curve instead, for local testing.
# [prediction]
# kind = "solcast"
# api_key = "…"                                    # required
# site_east = "5a28-19aa-f393-4bf5"                 # required, Solcast rooftop_site id
# site_west = "4fd3-ab64-b5e5-2ab7"                 # required
# state_path = "/var/lib/zendure/prediction_state.json"
# poll_times = ["06:00", "09:30", "12:30", "15:30", "18:30"]

[clock]
# IANA name. Cycle counting and the balance weekday are reckoned in it.
timezone = "Europe/Amsterdam"

[journal]
path = "/var/lib/zendure/journal.db"
# 1–3650. The only thing bounding the file's size.
retention_days = 30

[rte]
# The rolling 24h round-trip-efficiency window. Must survive reboots: /tmp is
# cleared, which rebuilt the window from scratch on every restart.
state_path = "/var/lib/zendure/rte_state.json"

[logging]
filter = "zendure=info"

# --- [tuning] is SessionConfig, verbatim -------------------------------------
#
# These fourteen names are one vocabulary in four places: this table, the
# journal's sessions.config_json, a fixture's session.config, and the knob names
# `zendure replay --set knob=value` accepts. A test asserts the key sets are
# equal, so they cannot drift apart.
#
# mqtt_timeout_secs is here and not under [mqtt] on purpose: it is the failsafe
# window the engine holds and the journal records, not a connection setting. It
# is measured against poll_interval_secs, and anything at or under three rounds
# of it warns and is raised.
[tuning]
charge_margin = 50
discharge_margin = 5
# Below this, a fresh adjustment is dropped rather than committed — the
# meter's own noise floor, not the margin above. Sized to the ~10-30 W of
# tick-to-tick jitter measured live in the device's reported power.
charge_deadband = 25
discharge_deadband = 25
# K: scales the deadbanded error before it's integrated onto the velocity-form
# law's own running commanded power. 100 = unity.
gain = 50
# Max change in commanded power per decision; also the anti-windup rail's width.
slew_limit = 400
charge_start_threshold = -100.0
# Import (W) above which discharge starts. Discharge stops at 0 W, so this is
# also the width of the idle/discharge band: at or below 0 there is no band, the
# mode flips on meter noise, and the value warns and takes the default (50).
discharge_start_threshold = 50.0
min_mode_duration_secs = 10
# The scan cycle paces decisions now, so this throttles nothing at 0. Raise it
# only to decide more slowly than poll_interval_secs samples.
min_decision_interval_secs = 0
# Was IDLE_TIMEOUT_MINUTES, in minutes. The name carries the unit now, and it
# is seconds — the same unit the journal has always recorded it in.
idle_timeout_secs = 300
min_idle_before_discharge_secs = 300
cycle_warn_threshold = 200
min_soc = 10
# The old 80 came with a note claiming the battery never drains overnight, which
# `zendure analyze` disproved: over 2026-09-13..16, 3.4-8.5 kWh a day was
# exported while the pack sat at that ceiling, and the night of the 15th hit
# min_soc at 22:00 and idled until 06:00. The packs are LiFePO4, which tolerates
# a high SOC far better than the phone/EV advice suggests, and this one is
# cycled daily rather than parked full. `balance_weekday` still reaches 100%
# whatever this says (see `effective_max_soc`), so cell balancing is unaffected.
max_soc = 95
# "none", "off" or "" disables the periodic cell-balancing full charge.
balance_weekday = "Mon"
# Solar export (W) on the solar phase at or above which discharge is skipped,
# so large loads (e.g. EV charging) pull from grid+solar instead of draining the
# home battery. 0 disables the guard.
solar_discharge_block_threshold = 200.0
mqtt_timeout_secs = 60
