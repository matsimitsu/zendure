[package]
name = "zendure"
version = "0.2.36"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `serde` is needed for `Weekday`, which rides inside every journaled `Clock`.
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# `bundled` compiles the SQLite amalgamation into the binary. The release ships a
# static musl build to a box with no libsqlite3.so, so linking the system library
# is not an option.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Parsing only — we never emit TOML, and warnings name a value's type through
# `Value::type_str` rather than rendering it. Pure Rust with no build script, so
# it adds nothing the static musl cross-build can trip over.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
maud = { version = "0.27", features = ["axum"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pure-Rust deflate only (no C dependency), to stay consistent with the static
# musl release build — see the `rusqlite`/`toml` comments above.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Pure Rust, no build script. Used only for the small amount of HTML/JS
# scraping the VW portal's login flow needs (form fields, the templateModel
# JSON blob, the csrf token) — see `src/car_battery/vw_portal.rs`.
regex = "1"

[dev-dependencies]
tempfile = "3"
# `full` (above) does not include `test-util` — it is deliberately excluded
# from the "give me everything" bundle since it changes runtime behaviour
# (`start_paused`) rather than adding a feature, and resolver 2+ keeps this
# dev-only addition out of the release binary.
tokio = { version = "1", features = ["test-util"] }
# Builds a `reqwest::Response` with a real status line from an `http::Response`,
# so a test can get a genuine `error_for_status` failure without a socket.
http = "1"

[build-dependencies]
grass = { version = "0.13", default-features = false }
