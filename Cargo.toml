[package]
name = "zendure"
version = "0.2.25"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `serde` is needed for `Weekday`, which rides inside every journaled `Clock`.
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# `bundled` compiles the SQLite amalgamation into the binary. The release ships a
# static musl build to a box with no libsqlite3.so, so linking the system library
# is not an option.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
